<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Montserrat',sans-serif;
  background:#0a1628;
  color:#fff;
  min-height:100vh;
}

/* ── GRID ── */
.book-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:8px;
  max-width:1200px;
  margin:0 auto;
}

@media(min-width:600px){
  .book-grid{ grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px; }
}

@media(min-width:900px){
  .book-grid{ grid-template-columns:repeat(4,1fr); gap:12px; padding:0 24px; }
}

@media(min-width:1100px){
  .book-grid{ grid-template-columns:repeat(5,1fr); }
}

.book-item{
  aspect-ratio:2/3;
  border-radius:6px;
  overflow:hidden;
  background:#111827;
  position:relative;
}

.book-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* fallback label if image fails */
.book-item .book-label{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:12px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#cbd5e1;
  line-height:1.4;
  background:linear-gradient(135deg,#111827,#1e293b);
}

.book-item img.errored{
  display:none;
}

.book-item img.errored ~ .book-label{
  display:flex;
}

/* ── PLAYER ── */
.player-card{
  grid-column:1 / -1;
  background:linear-gradient(135deg,#0d1f38 0%,#111827 100%);
  border:1px solid rgba(29,185,84,.25);
  border-radius:14px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  margin:4px 0;
}

.player-cover{
  width:56px;
  height:56px;
  border-radius:8px;
  object-fit:cover;
  flex-shrink:0;
  background:#1e293b;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-title{
  font-size:13px;
  font-weight:700;
  color:#f1f5f9;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:2px;
}

.player-sub{
  font-size:11px;
  color:#1db954;
  font-weight:600;
}

.player-controls{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
  min-width:0;
}

.player-bar-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.player-time{
  font-size:10px;
  color:#64748b;
  font-weight:600;
  flex-shrink:0;
  min-width:32px;
}

.player-bar{
  flex:1;
  height:4px;
  background:rgba(255,255,255,.1);
  border-radius:4px;
  overflow:hidden;
  cursor:pointer;
}

.player-bar-fill{
  height:100%;
  width:38%;
  background:var(--g,#1db954);
  border-radius:4px;
  transition:width .3s;
}

.player-btns{
  display:flex;
  align-items:center;
  gap:10px;
}

.player-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:#94a3b8;
  padding:0;
  font-size:16px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:color .15s;
}

.player-btn:hover{ color:#fff; }

.player-btn.play{
  width:38px;
  height:38px;
  background:#1db954;
  border-radius:50%;
  color:#000;
  font-size:15px;
  flex-shrink:0;
}

.player-btn.play:hover{ background:#17a347; }

.player-vol{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.player-vol-bar{
  width:52px;
  height:3px;
  background:rgba(255,255,255,.1);
  border-radius:3px;
  overflow:hidden;
}

.player-vol-fill{
  height:100%;
  width:70%;
  background:#1db954;
  border-radius:3px;
}

@media(max-width:480px){
  .player-vol{ display:none; }
  .player-cover{ width:46px; height:46px; }
}
</style>
</head>
<body>

<main class="book-grid" id="grid"></main>

<script>
var books = [
  'paginas/download.jpg',
  'paginas/download (1).jpg',
  'paginas/download (2).jpg',
  'paginas/download (3).jpg',
  'paginas/download (4).jpg',
  'paginas/download (5).jpg',
  'paginas/download (6).jpg',
  'paginas/download (7).jpg',
  'paginas/download (8).jpg',
  'paginas/download (9).jpg',
  'paginas/download (10).jpg',
  'paginas/download (11).jpg',
  'paginas/download (12).jpg',
  'paginas/download (13).jpg',
  'paginas/download (14).jpg',
  'paginas/download (15).jpg',
  'paginas/download (16).jpg',
  'paginas/download (17).jpg',
  'paginas/download (18).jpg',
  'paginas/download (19).jpg',
  'paginas/download (20).jpg',
  'paginas/download (21).jpg',
  'paginas/download (22).jpg',
  'paginas/download (23).jpg',
  'paginas/download (24).jpg',
  'paginas/download (25).jpg',
  'paginas/download (26).jpg',
  'paginas/download.png',
  'paginas/download (1).png',
  'paginas/download (2).png',
  'paginas/download (3).png',
  'paginas/download.webp',
  'paginas/shopping.webp',
  'paginas/shopping (1).webp',
  'paginas/shopping (2).webp',
  'paginas/shopping (3).webp',
  'paginas/91NY3dGiqUL._AC_UF1000,1000_QL80_.jpg',
  'paginas/l1.jpg',
  'paginas/l1.png',
  'paginas/l2.png',
  'paginas/l3.png',
  'paginas/l4.png',
  'paginas/l6.jpg',
  'paginas/l7.png',
  'paginas/l8.png',
  'paginas/l10.jpg',
  'paginas/l11.jpg',
  'paginas/l13.jpg'
];

var grid = document.getElementById('grid');
var mid = Math.floor(books.length / 2);
var playing = false;
var progress = 38;
var timer = null;

var playerHTML =
  '<div class="player-card" id="player">' +
    '<img class="player-cover" id="playerCover" src="paginas/download.jpg" alt=""/>' +
    '<div class="player-info">' +
      '<div class="player-title" id="playerTitle">O Poder do Hábito</div>' +
      '<div class="player-sub">🎧 Audiobook</div>' +
    '</div>' +
    '<div class="player-controls">' +
      '<div class="player-bar-wrap">' +
        '<span class="player-time" id="playerCur">1:49</span>' +
        '<div class="player-bar" id="playerBarWrap">' +
          '<div class="player-bar-fill" id="playerFill"></div>' +
        '</div>' +
        '<span class="player-time" style="text-align:right">4:52</span>' +
      '</div>' +
      '<div class="player-btns">' +
        '<button class="player-btn" title="Anterior" onclick="playerPrev()">⏮</button>' +
        '<button class="player-btn play" id="playBtn" onclick="playerToggle()" title="Play / Pause">▶</button>' +
        '<button class="player-btn" title="Próximo" onclick="playerNext()">⏭</button>' +
        '<div class="player-vol">' +
          '<span style="font-size:13px;color:#64748b">🔊</span>' +
          '<div class="player-vol-bar"><div class="player-vol-fill"></div></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

var html = '';
books.forEach(function(src, i){
  if(i === mid) html += playerHTML;
  html +=
    '<div class="book-item">' +
      '<img src="' + src + '" alt="" loading="lazy" ' +
        'onerror="this.classList.add(\'errored\')">' +
      '<div class="book-label"></div>' +
    '</div>';
});
grid.innerHTML = html;

// Click on book cover → load into player
grid.querySelectorAll('.book-item').forEach(function(item, i){
  item.style.cursor = 'pointer';
  item.addEventListener('click', function(){
    var img = item.querySelector('img');
    var src = img && !img.classList.contains('errored') ? img.src : '';
    if(src){
      document.getElementById('playerCover').src = src;
      document.getElementById('playerTitle').textContent = 'Reproduzindo audiobook';
    }
    progress = 0;
    if(!playing) playerToggle();
    document.getElementById('player').scrollIntoView({behavior:'smooth', block:'center'});
  });
});

function playerToggle(){
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if(playing){
    timer = setInterval(function(){
      progress = Math.min(100, progress + 0.15);
      document.getElementById('playerFill').style.width = progress + '%';
      var total = 292;
      var cur = Math.round(total * progress / 100);
      var m = Math.floor(cur/60), s = cur%60;
      document.getElementById('playerCur').textContent = m+':'+(s<10?'0':'')+s;
      if(progress >= 100){ clearInterval(timer); playing = false; document.getElementById('playBtn').textContent = '▶'; }
    }, 300);
  } else {
    clearInterval(timer);
  }
}

function playerPrev(){
  progress = 0;
  document.getElementById('playerFill').style.width = '0%';
  document.getElementById('playerCur').textContent = '0:00';
}

function playerNext(){
  progress = 0;
  document.getElementById('playerFill').style.width = '0%';
  document.getElementById('playerCur').textContent = '0:00';
  if(!playing) playerToggle();
}
</script>

</body>
</html>
