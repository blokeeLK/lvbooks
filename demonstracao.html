<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Montserrat',sans-serif;
  background:#0a1628;
  color:#fff;
  min-height:100vh;
}

/* ── GRID ── */
.book-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:8px;
  max-width:1200px;
  margin:0 auto;
}

@media(min-width:600px){
  .book-grid{ grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px; }
}

@media(min-width:900px){
  .book-grid{ grid-template-columns:repeat(4,1fr); gap:12px; padding:0 24px; }
}

@media(min-width:1100px){
  .book-grid{ grid-template-columns:repeat(5,1fr); }
}

.book-item{
  aspect-ratio:2/3;
  border-radius:6px;
  overflow:hidden;
  background:#111827;
  position:relative;
}

.book-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* fallback label if image fails */
.book-item .book-label{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:12px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#cbd5e1;
  line-height:1.4;
  background:linear-gradient(135deg,#111827,#1e293b);
}

.book-item img.errored{
  display:none;
}

.book-item img.errored ~ .book-label{
  display:flex;
}

</style>
</head>
<body>

<main class="book-grid" id="grid"></main>
