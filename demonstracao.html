<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Montserrat',sans-serif;
  background:#0a1628;
  color:#fff;
  min-height:100vh;
}

.page-header{
  padding:36px 16px 24px;
  text-align:center;
}

.page-header h1{
  font-size:clamp(16px,4vw,22px);
  font-weight:700;
  color:#e2e8f0;
  letter-spacing:.01em;
}

.page-header h1 span{
  color:#1db954;
}

/* ── GRID ── */
.book-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:0 8px;
  max-width:1200px;
  margin:0 auto;
}

@media(min-width:600px){
  .book-grid{ grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px; }
}

@media(min-width:900px){
  .book-grid{ grid-template-columns:repeat(4,1fr); gap:12px; padding:0 24px; }
}

@media(min-width:1100px){
  .book-grid{ grid-template-columns:repeat(5,1fr); }
}

.book-item{
  aspect-ratio:2/3;
  border-radius:6px;
  overflow:hidden;
  background:#111827;
  position:relative;
}

.book-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* fallback label if image fails */
.book-item .book-label{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:12px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#cbd5e1;
  line-height:1.4;
  background:linear-gradient(135deg,#111827,#1e293b);
}

.book-item img.errored{
  display:none;
}

.book-item img.errored ~ .book-label{
  display:flex;
}

/* ── CTA ── */
.cta-wrap{
  padding:52px 16px 64px;
  text-align:center;
}

.cta-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#1db954;
  color:#000;
  font-family:'Montserrat',sans-serif;
  font-size:clamp(15px,3vw,17px);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  padding:18px 40px;
  border-radius:10px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  animation:pulse 2s infinite;
}

.cta-btn:hover{
  background:#17a347;
  animation:none;
}

@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(29,185,84,.5); }
  50%{ box-shadow:0 0 0 14px rgba(29,185,84,0); }
}

.cta-sub{
  margin-top:12px;
  font-size:12px;
  color:#64748b;
}
</style>
</head>
<body>

<header class="page-header">
  <h1>Veja alguns livros <span>disponíveis</span></h1>
</header>

<main class="book-grid" id="grid"></main>

<div class="cta-wrap">
  <a href="#" class="cta-btn">📖 QUERO ACESSAR AGORA</a>
  <p class="cta-sub">Acesso imediato · Sem mensalidade · Vitalício</p>
</div>

<script>
var books = [

  { title: 'O Homem Mais Rico da Babilônia',                         img: 'paginas/download (8).jpg' },

  { title: 'Memórias de um Suicida',                                 img: 'paginas/download (13).jpg' },

      '<img src="' + b.img + '" alt="' + b.title + '" loading="lazy" ' +
        'onerror="this.classList.add(\'errored\')">' +
      '<div class="book-label">' + b.title + '</div>' +
    '</div>';
});

</script>
