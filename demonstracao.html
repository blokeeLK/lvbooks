<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){
  var h=window.location.hostname,p=window.location.protocol;
  if(h!=='lvbooks.com.br'||p!=='https:'){
    window.location.replace('https://lvbooks.com.br'+window.location.pathname+window.location.search+window.location.hash);
  }
})();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Demonstração</title>
<link rel="icon" type="image/png" href="audio%20book/banner.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>


<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Montserrat',sans-serif;
  background:#0a1628;
  color:#fff;
  min-height:100vh;
}

/* ── GRID ── */
.book-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:8px;
  max-width:1200px;
  margin:0 auto;
}

@media(min-width:600px){
  .book-grid{ grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px; }
}

@media(min-width:900px){
  .book-grid{ grid-template-columns:repeat(4,1fr); gap:12px; padding:0 24px; }
}

@media(min-width:1100px){
  .book-grid{ grid-template-columns:repeat(5,1fr); }
}

.book-item{
  aspect-ratio:2/3;
  border-radius:6px;
  overflow:hidden;
  background:#111827;
  position:relative;
}

.book-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* fallback label if image fails */
.book-item .book-label{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:12px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#cbd5e1;
  line-height:1.4;
  background:linear-gradient(135deg,#111827,#1e293b);
}

.book-item img.errored{
  display:none;
}

.book-item img.errored ~ .book-label{
  display:flex;
}

/* ── PLAY OVERLAY ── */
.book-item .play-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.book-item .play-circle{
  width:44px;
  height:44px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(2px);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid rgba(255,255,255,.7);
}

.book-item .play-circle svg{
  width:16px;
  height:16px;
  fill:#fff;
  margin-left:3px;
}
</style>
</head>
<body>

<main class="book-grid" id="grid"></main>

<script>
var books = [
  'paginas/download.jpg',

  'paginas/download (10).jpg',

var playIcon =
  '<div class="play-overlay">' +
    '<div class="play-circle">' +
      '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>' +
    '</div>' +
  '</div>';

var grid = document.getElementById('grid');
var html = '';
books.forEach(function(src){
  html +=
    '<div class="book-item">' +
      '<img src="' + src + '" alt="" loading="lazy" ' +
        'onerror="this.classList.add(\'errored\')">' +
      '<div class="book-label"></div>' +
      playIcon +
    '</div>';
});
grid.innerHTML = html;
</script>

</body>
</html>
